# ==============================================================================
# LineFollowerPro — Configuración Oficial de Nginx Reverse Proxy
# Dominio objetivo: robotica.ouroboros-software.com
# ==============================================================================

# Si usas Cloudflare con SSL (Flexible o Full):
server {
    listen 80;
    listen [::]:80;
    server_name robotica.ouroboros-software.com;

    # Directorio de archivos estáticos compilados (SPA Svelte)
    # Ajusta esta ruta a donde tengas publicado el frontend o backend/wwwroot
    root /var/www/linefollower/wwwroot;
    index index.html;

    # Tamaño máximo de carga para binarios y respaldos
    client_max_body_size 50M;

    # Gzip para acelerar la carga de assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. Enrutamiento WebSocket para Telemetría en Vivo (Vital para /ws/telemetry)
    location /ws/ {
        proxy_pass http://127.0.0.1:5010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Evitar cortes prematuros de la conexión serial/telemetría
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 2. Enrutamiento REST API hacia el Backend ASP.NET Core (Puerto 5010)
    location /api/ {
        proxy_pass http://127.0.0.1:5010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 3. Descarga directa de ejecutables y firmwares compilados
    location /downloads/ {
        alias /var/www/linefollower/downloads/;
        autoindex off;
    }

    # 4. Fallback SPA (Single Page Application)
    # Redirige rutas desconocidas a index.html sin romper /api/ ni /ws/
    location / {
        try_files $uri $uri/ /index.html;
    }
}
