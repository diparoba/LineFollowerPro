[package]
name = "line-follower-pro"
version = "0.2.0"
description = "LineFollower Pro - Desktop Dashboard & Telemetry Suite"
authors = ["Paulo"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-log = "2"
serialport = "4.5"
rusqlite = { version = "0.31", features = ["bundled"] }
